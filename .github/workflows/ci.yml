name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml || (echo 'Generate and commit pnpm-lock.yaml locally first' && exit 1)
      - run: pnpm install --frozen-lockfile
      - run: pnpm secrets:all
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:scanner
      - run: pnpm audit
      - run: pnpm build
      - name: Smoke test production build
        run: |
          pnpm start --hostname 127.0.0.1 > /tmp/quality-app.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          pnpm smoke || { cat /tmp/quality-app.log; exit 1; }
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
